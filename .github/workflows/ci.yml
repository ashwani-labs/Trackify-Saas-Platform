name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        env:
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
        run: mvn -B test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            npm ci && exit 0
            echo "npm ci failed; waiting before retry..."
            sleep $((attempt * 20))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Ensure Rolldown native bindings
        run: |
          for attempt in 1 2 3; do
            node scripts/ensure-rolldown-binding.mjs && exit 0
            echo "ensure-rolldown-binding failed; waiting before retry..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
