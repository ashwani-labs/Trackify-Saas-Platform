server:
  port: 8082

spring:
  application:
    name: tenant-service
  profiles:
    active: local
  config:
    import:
      - optional:classpath:trackify-management.yml
      - optional:classpath:trackify-env-imports.yml

jwt:
  expiration: 86400000

trackify:
  internal-api-key: ${INTERNAL_API_KEY:}
