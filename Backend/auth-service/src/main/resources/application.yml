server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: local
  config:
    import:
      - optional:classpath:trackify-management.yml
      - optional:classpath:trackify-env-imports.yml
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  expiration: 86400000
