server:
  port: 8083

spring:
  application:
    name: project-service
  profiles:
    active: local
  config:
    import:
      - optional:classpath:trackify-management.yml
      - optional:classpath:trackify-env-imports.yml
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  expiration: 86400000

trackify:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    location: ${STORAGE_LOCAL_PATH:./uploads}
    max-file-size-bytes: ${STORAGE_MAX_FILE_BYTES:10485760}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      key-prefix: ${S3_KEY_PREFIX:attachments}
  internal-api-key: ${INTERNAL_API_KEY:}
