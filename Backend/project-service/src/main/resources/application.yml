server:
  port: 8083

spring:
  application:
    name: project-service
  config:
    import: optional:classpath:trackify-management.yml
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

trackify:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    location: ${STORAGE_LOCAL_PATH:./uploads}
    max-file-size-bytes: ${STORAGE_MAX_FILE_BYTES:10485760}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      key-prefix: ${S3_KEY_PREFIX:attachments}
  internal-api-key: ${INTERNAL_API_KEY:}

services:
  notification-url: http://localhost:8084

jwt:
  secret: ${JWT_SECRET:trackify-local-dev-jwt-secret-min-32-chars!}
  expiration: 86400000
