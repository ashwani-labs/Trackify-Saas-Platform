server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:trackify-management.yml
  servlet:
    multipart:
      enabled: false

services:
  auth-url: http://localhost:8081
  tenant-url: http://localhost:8082
  project-url: http://localhost:8083

jwt:
  secret: ${JWT_SECRET:trackify-local-dev-jwt-secret-min-32-chars!}
  expiration: 86400000

trackify:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
