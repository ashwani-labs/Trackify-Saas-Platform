server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: local
  config:
    import:
      - optional:classpath:trackify-management.yml
      - optional:classpath:trackify-env-imports.yml
  servlet:
    multipart:
      enabled: false

jwt:
  expiration: 86400000

trackify:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
